<!doctype html>
<html lang="en" data-theme="dark"><!-- the site defaults to dark (docusaurus.config.js colorMode) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Argos big board: the TV view shown at meetings. Served from static/tools/ and embedded by
     src/pages/big-board/index.js. On the TV, open /tools/big-board.html directly in full-screen mode.
     Data comes from the Apps Script web app in apps-script/big-board/ via big-board-common.js. -->
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Argos Big Board</title>
<script>
  // Match teamargos.org's light/dark mode (same approach as the other tools in static/tools/).
  (function () {
    const embedded = window.parent !== window;
    if (embedded) document.documentElement.classList.add("embedded");
    function syncTheme() {
      let t = null;
      try { if (embedded) t = window.parent.document.documentElement.getAttribute("data-theme"); } catch (e) {}
      if (!t) { try { t = localStorage.getItem("theme"); } catch (e) {} }
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    }
    syncTheme();
    try {
      if (embedded) new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #ffffff; --panel: #f5f6f7; --ink: #1c1e21; --muted: #606770; --line: #dadde1;
  --brand: #ffc800; --on-brand: #000000; --accent: #404040; --warn: #d4282e;
  --radius: 0.4rem;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1d; --panel: #242526; --ink: #e3e3e3; --muted: #a8adb4; --line: #444950;
    --accent: #ffc800; --warn: #fa383e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1d; --panel: #242526; --ink: #e3e3e3; --muted: #a8adb4; --line: #444950;
  --accent: #ffc800; --warn: #fa383e; color-scheme: dark;
}
/* Everything is sized in rem, and rem follows the screen width, so the board
   fills a TV the same way it fills a laptop. Change the vw value to make the
   whole board bigger or smaller. */
html { font-size: clamp(11px, 0.85vw, 32px); }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.35; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Passcode screen (same as the kiosk) */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; font-size: 16px; }
.lock-card { width: min(420px, 100%); display: grid; gap: 14px; padding: 28px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; }
.lock-card h1 { margin: 0; font-size: 30px; }
.lock-card p { margin: 0; color: var(--muted); }
.lock-card input { width: 100%; font-size: 24px; padding: 10px 14px; background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius); }
.primary { font-size: 20px; font-weight: 700; padding: 12px; border: 0; border-radius: var(--radius);
  background: var(--brand); color: var(--on-brand); cursor: pointer; }
.primary:disabled { opacity: 0.6; cursor: wait; }
.msg { color: var(--warn) !important; min-height: 1.5em; }

/* Board */
.board { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 1.2rem; padding: 1.4rem 1.6rem 0.8rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.title { display: flex; align-items: center; gap: 0.9rem; }
.mark { width: 0.6rem; height: 2.6rem; background: var(--brand); border-radius: 99px; }
.title h1 { margin: 0; font-size: 2.6rem; line-height: 1; letter-spacing: -0.01em; }
.title small { display: block; margin-top: 0.25rem; font-size: 1.1rem; color: var(--muted); font-weight: 500; }
.when { text-align: right; }
.clock { font-size: 3.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.date { margin-top: 0.3rem; font-size: 1.2rem; color: var(--muted); }

.cols { min-height: 0; display: grid; grid-template-columns: 1fr minmax(13rem, 18rem); gap: 1.2rem; }
.left { min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: 1.2rem; }

/* With GitHub task panels: reminders/deadlines | tasks | who's here */
.cols.with-tasks { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.4fr) minmax(13rem, 17rem); }
.with-tasks .announcements li { font-size: 1.4rem; }
.with-tasks .deadline { grid-template-columns: 4.6rem 1fr auto; gap: 0.8rem; padding: 0.45rem 0; }
.with-tasks .dl-title { font-size: 1.2rem; }
.with-tasks .dl-left { font-size: 1.05rem; }
/* The task panels share the column by how much each has to show */
.mid { min-height: 0; display: flex; flex-direction: column; gap: 1.2rem; }
.task-card { flex: 1 1 auto; min-height: 0; }
/* Inside a panel: two columns, Ready to start | In progress */
.task-cols { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
  grid-template-rows: minmax(0, 1fr); gap: 0.9rem; }
.task-cols .task-group { margin: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 0.5rem; border-top: 0.28rem solid var(--line); padding: 0.55rem 0.7rem 0.4rem; }
.task-cols .task-group.active { border-top-color: var(--brand); }
.task-cols .task-group h3 { display: flex; justify-content: space-between; color: var(--ink); font-size: 1rem;
  margin: 0 0 0.6rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--line); }
.task-cols .task-group h3 b { color: var(--muted); font-variant-numeric: tabular-nums; }
/* Each task is its own card, with a color bar matching its column */
.task-cols .task-list { gap: 0.45rem; }
.task-cols .task { background: var(--panel); border: 1px solid var(--line); border-left: 0.3rem solid var(--muted);
  border-radius: 0.4rem; padding: 0.45rem 0.65rem; }
.task-cols .task.active { border-left-color: var(--brand); }
.task-cols .task .t-title { font-size: 1.1rem; line-height: 1.3; }

/* Drag to set priority */
.task-cols .task, .tv-card { display: flex; align-items: flex-start; gap: 0.4rem; }
.task-cols .task .t-title, .tv-body { flex: 1; min-width: 0; }
.grip { flex: none; background: none; border: 0; padding: 0 0.15rem; margin: 0.05rem 0 0 -0.25rem; font-size: 1.1rem; line-height: 1.2;
  color: var(--muted); opacity: 0.55; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.grip:hover, .grip:focus-visible { opacity: 1; color: var(--ink); }
.grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
.drag-placeholder { opacity: 0.3; }
.drag-ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; list-style: none;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); cursor: grabbing; }
body:has(.drag-ghost) { cursor: grabbing; user-select: none; }
.task-none { color: var(--muted); font-size: 0.95rem; }
.task-cols .task-more { padding-left: 0; }
.tasks-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; margin: 0 0 0.6rem; }
.tasks-head h2 { margin: 0; }
.tasks-head .ready { font-size: 1rem; color: var(--muted); white-space: nowrap; }
.task-group { margin: 0 0 0.7rem; }
.task-group h3 { margin: 0 0 0.35rem; font-size: 0.95rem; font-weight: 700; color: var(--muted); }
.task-group h3 b { color: var(--ink); margin-left: 0.25rem; }
.task-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
.task { padding: 0.35rem 0 0.35rem 0.75rem; border-left: 0.28rem solid var(--brand); }
.task.ready { border-left-color: var(--muted); }
.tasks-head .expand { font-size: 1.2rem; line-height: 1; padding: 0.25rem 0.5rem; background: transparent;
  border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); cursor: pointer; }
.tasks-head .expand:hover { color: var(--ink); border-color: var(--muted); }

/* Full-screen task board */
.tv-overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid;
  grid-template-rows: auto 1fr; gap: 1rem; padding: 1.2rem 1.6rem; }
.tv-head { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.tv-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tv-tabs button { font-size: 1.3rem; font-weight: 700; padding: 0.4rem 1.2rem; border: 0; background: var(--panel);
  color: var(--ink); cursor: pointer; }
.tv-tabs button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.tv-info { color: var(--muted); font-size: 1.05rem; margin-right: auto; }
.tv-info a { color: var(--accent); }
.tv-head .ghost { font-size: 1rem; padding: 0.4rem 1rem; }
.tv-board { min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(14rem, 1fr);
  gap: 0.9rem; overflow-x: auto; }
.tv-col { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
  border-radius: 0.8rem; padding: 0.8rem 0.8rem 0.4rem; border-top: 0.3rem solid var(--line); }
.tv-col.active { border-top-color: var(--brand); }
.tv-col.help { border-top-color: var(--warn); }
.tv-col h3 { margin: 0 0 0.6rem; font-size: 1.1rem; display: flex; justify-content: space-between; gap: 0.5rem; }
.tv-col h3 b { color: var(--muted); font-variant-numeric: tabular-nums; }
.tv-list { list-style: none; margin: 0; padding: 0 0 0.4rem; display: grid; gap: 0.5rem; overflow-y: auto; align-content: start; }
.tv-card { background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.55rem 0.7rem; }
.tv-card.help { border-left: 0.25rem solid var(--warn); }
.tv-card .t-title { display: block; font-size: 1.05rem; font-weight: 600; line-height: 1.3; color: var(--ink); text-decoration: none; }
.tv-card .t-title:hover { text-decoration: underline; }
.tv-card .t-meta { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; overflow-wrap: anywhere; }
.tv-empty { color: var(--muted); font-size: 0.95rem; padding: 0.3rem; }
.task .t-title { font-size: 1.2rem; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.task .t-meta { font-size: 0.9rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-group.help h3 { color: var(--warn); }
.task-more { font-size: 0.95rem; color: var(--muted); padding-left: 1rem; }
.tasks-stale { font-size: 0.85rem; color: var(--muted); margin-top: auto; }
.card { min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line);
  border-radius: 0.8rem; padding: 1.1rem 1.3rem; display: flex; flex-direction: column; }
.card h2 { margin: 0 0 0.8rem; font-size: 1.05rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.empty { color: var(--muted); font-size: 1.2rem; margin: 0; }

.announcements { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.7rem; }
.announcements li { position: relative; padding-left: 1.5rem; font-size: 1.75rem; font-weight: 600; line-height: 1.25; }
.announcements li::before { content: ""; position: absolute; left: 0; top: 0.45em; width: 0.6rem; height: 0.6rem;
  border-radius: 99px; background: var(--brand); }

.deadlines { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15rem; }
.deadline { display: grid; grid-template-columns: 5.4rem 1fr auto; align-items: center; gap: 1rem;
  padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.deadline:last-child { border-bottom: 0; }
.dl-date { text-align: center; line-height: 1.1; }
.dl-date .dow { display: block; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.dl-date .md { display: block; font-size: 1.3rem; font-weight: 700; }
.dl-title { font-size: 1.45rem; font-weight: 600; }
.dl-cat { display: block; font-size: 0.95rem; color: var(--muted); font-weight: 500; }
.dl-left { font-size: 1.25rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.deadline.soon .dl-left { color: var(--on-brand); background: var(--brand); padding: 0.2rem 0.7rem; border-radius: 99px; }

.card h2 .count { font-size: 1.3rem; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
/* Who's here: a plain list of names. Switches to two narrower columns when
   there are too many names to fit (see fitHereList). */
.here { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow: hidden;
  font-size: 1.3rem; font-weight: 600; line-height: 1.25; }
.here li { padding: 0.18rem 0 0.18rem 0.8rem; border-left: 0.28rem solid var(--brand); margin-bottom: 0.3rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; break-inside: avoid; }
.here.two-col { column-count: 2; column-gap: 0.8rem; column-fill: auto; font-size: 1.1rem; }
.here.two-col li { padding-left: 0.55rem; border-left-width: 0.22rem; margin-bottom: 0.25rem; }
.here li.more { border-left-color: transparent; color: var(--muted); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 0.95rem; color: var(--muted); }
.foot.stale #updated { color: var(--warn); font-weight: 700; }
.ghost { font-size: 0.9rem; padding: 0.25rem 0.8rem; background: transparent; border: 1px solid var(--line);
  border-radius: var(--radius); color: var(--muted); cursor: pointer; }
.foot-actions { display: flex; align-items: center; gap: 0.6rem; }
.cog { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem;
  border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); }
.cog:hover { color: var(--ink); border-color: var(--muted); }
.cog svg { width: 1.15rem; height: 1.15rem; }

/* Narrow screens (a phone checking the board): stack the columns and let the page scroll. */
@media (max-width: 760px) {
  html { font-size: 13px; }
  .board { height: auto; min-height: 100vh; padding: 16px; }
  .cols { grid-template-columns: 1fr; }
  .top { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card">
    <h1>Argos Big Board</h1>
    <p>Enter the team passcode to unlock this screen.</p>
    <input id="codeInput" type="password" autocomplete="off" aria-label="Team passcode" required>
    <button id="unlockBtn" class="primary" type="submit">Unlock</button>
    <p id="lockMsg" class="msg" role="alert"></p>
  </form>
</div>

<div id="app" class="board" hidden>
  <header class="top">
    <div class="title">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Argos 1756</h1>
        <small>Big Board</small>
      </div>
    </div>
    <div class="when">
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>
  </header>

  <div id="cols" class="cols">
    <div class="left">
      <section class="card">
        <h2>Reminders</h2>
        <ul id="announcements" class="announcements"></ul>
      </section>
      <section class="card">
        <h2>Upcoming deadlines</h2>
        <ul id="deadlines" class="deadlines"></ul>
      </section>
    </div>
    <!-- GitHub Projects task panels; shown only when the server sends tasks -->
    <div id="taskCol" class="mid" hidden></div>
    <section class="card">
      <h2>Here now <span id="hereCount" class="count"></span></h2>
      <ul id="hereList" class="here"></ul>
    </section>
  </div>

  <!-- Full-screen task board for one project (opened with a panel's ⤢ button) -->
  <div id="taskOverlay" class="tv-overlay" role="dialog" aria-modal="true" aria-label="All tasks" hidden>
    <header class="tv-head">
      <div class="tv-tabs" id="tvTabs" role="group" aria-label="Project"></div>
      <div class="tv-info" id="tvInfo"></div>
      <button id="tvClose" class="ghost" type="button">Close</button>
    </header>
    <div class="tv-board" id="tvBoard"></div>
  </div>

  <footer id="foot" class="foot">
    <span id="updated"></span>
    <div class="foot-actions">
      <a id="kioskLink" class="cog" href="big-board-checkin.html" title="Check-in kiosk" aria-label="Check-in kiosk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <polyline points="16 11 18 13 22 9"/>
        </svg>
      </a>
      <a id="adminLink" class="cog" href="big-board-admin.html" title="Admin: edit reminders and deadlines" aria-label="Admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </a>
      <button id="lockBtn" class="ghost" type="button">Lock</button>
    </div>
  </footer>
</div>

<script src="big-board-common.js"></script>
<script>
const { api } = BigBoard;
const REFRESH_MS = 60 * 1000;
const STALE_MS = 3 * 60 * 1000; // warn when the last good update is older than this
const MAX_DEADLINES = 8;

const $ = (id) => document.getElementById(id);
let refreshTimer = null;
let lastUpdate = null;

// ---- Lock / unlock ------------------------------------------------------

function showLock(message) {
  BigBoard.setCode('');
  clearInterval(refreshTimer);
  $('app').hidden = true;
  $('lock').hidden = false;
  $('lockMsg').textContent = message || '';
  $('codeInput').value = '';
  $('codeInput').focus();
}

$('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('unlockBtn');
  btn.disabled = true;
  $('lockMsg').textContent = '';
  const typed = $('codeInput').value.trim();
  try {
    const data = await api({ view: 'ping' }, null, typed);
    if (data.ok) {
      BigBoard.setCode(typed);
      start();
    } else {
      $('lockMsg').textContent = BigBoard.unlockError(data);
    }
  } catch (err) {
    $('lockMsg').textContent = BigBoard.unlockError(err);
  } finally {
    btn.disabled = false;
  }
});

// Inside the site page (/big-board/), open the kiosk and admin pages as whole
// site pages rather than inside this frame.
if (document.documentElement.classList.contains('embedded')) {
  $('kioskLink').href = '/big-board/checkin/';
  $('kioskLink').target = '_top';
  $('adminLink').href = '/big-board/admin/';
  $('adminLink').target = '_top';
}

$('lockBtn').addEventListener('click', () => {
  if (confirm('Lock this screen? The passcode will be needed to unlock it.')) showLock('');
});

function start() {
  $('lock').hidden = true;
  $('app').hidden = false;
  refresh();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refresh, REFRESH_MS);
}

// ---- Data ---------------------------------------------------------------

async function refresh() {
  if (!BigBoard.code) return;
  try {
    const data = await api({ view: 'board' });
    if (data.ok) {
      lastUpdate = new Date();
      render(data);
    } else if (data.error === 'unauthorized') {
      showLock('The passcode has changed. Enter the new one.');
    }
    // Other server errors: keep showing the last good data; the footer turns red when it's stale.
  } catch (err) {
    // Network error: same as above.
  }
  tick();
}

function render(data) {
  renderAnnouncements(data.announcements || []);
  renderDeadlines(data.deadlines || []);
  renderTasks(data.tasks); // first: it changes the column widths the names list fits into
  renderHere(data.here || []);
}

// ---- GitHub task panels -------------------------------------------------
// data.tasks (saved by the Apps Script every few minutes):
//   { updatedAt, error?, projects: [{ number, label, url, doneCount,
//     columns: [{ name, label, kind, items: [{ title, ref, assignees, url }] }] }] }
// One column per project status, in the project's order. kind is 'active'
// (in progress), 'ready', 'review', 'help' (needs help / on hold) or 'backlog'.
// The board panels show only in-progress and ready tasks; the expand button
// opens every column full screen.

const PANEL_GROUPS = [
  { kind: 'ready', name: 'Ready to start' },
  { kind: 'active', name: 'In progress' },
];

let lastTasks = null;
let expanded = null; // number of the project open full screen, or null

function renderTasks(tasks, focusId) {
  if (dragging) return; // never rebuild a list while a task is being dragged
  lastTasks = tasks;
  const col = $('taskCol');
  const projects = (tasks && tasks.projects) || [];
  col.hidden = !projects.length;
  $('cols').classList.toggle('with-tasks', projects.length > 0);
  col.replaceChildren();
  projects.forEach((p) => {
    const card = el('section', 'card task-card');
    const head = el('div', 'tasks-head');
    head.append(el('h2', '', p.label));
    const open = el('button', 'expand', '⤢');
    open.type = 'button';
    open.title = 'Show every ' + p.label + ' task, by status';
    open.setAttribute('aria-label', open.title);
    open.addEventListener('click', () => openTasks(p.number));
    head.append(open);
    card.append(head);

    // Two side-by-side columns: Ready to start | In progress
    const cols = el('div', 'task-cols');
    PANEL_GROUPS.forEach(({ kind, name }) => {
      const items = p.columns.filter((c) => c.kind === kind).flatMap((c) => c.items);
      const box = el('div', 'task-group ' + kind);
      const h = el('h3', '', name);
      h.append(el('b', '', String(items.length)));
      const ul = el('ul', 'task-list');
      items.forEach((t) => ul.append(taskItem(t, kind)));
      if (!items.length) ul.append(el('li', 'task-none', 'None'));
      makeSortable(ul, p.number);
      box.append(h, ul);
      cols.append(box);
    });
    card.append(cols);
    col.append(card);
  });
  col.querySelectorAll('.task-group').forEach(fitTaskGroup);
  if (expanded !== null) renderExpanded();
  if (focusId) {
    // After a keyboard move, keep focus on the moved task's grip.
    const scope = expanded !== null ? $('tvBoard') : col;
    const g = [...scope.querySelectorAll('[data-id]')].find((x) => x.dataset.id === focusId);
    if (g) g.querySelector('.grip').focus({ preventScroll: true });
  }
}

/** A task on the board panel: a drag grip and its name (details are in the expanded view). */
function taskItem(t, kind) {
  const li = el('li', 'task ' + kind);
  if (t.id) { li.dataset.id = t.id; li.append(grip()); }
  li.append(el('div', 't-title', t.title));
  return li;
}

// ---- Drag to set priority -------------------------------------------------
// Tasks can be dragged up and down within a column (grab the ⠿ grip; works
// with a mouse or a touchscreen), or moved with the arrow keys once the grip
// has focus. The order is saved by the Apps Script for the board only; it
// doesn't change anything in GitHub.

let dragging = false;

function grip() {
  const g = el('button', 'grip', '⠿');
  g.type = 'button';
  g.title = 'Drag to change priority';
  g.setAttribute('aria-label', 'Move task (drag, or use the up and down arrow keys)');
  return g;
}

/** Lets the tasks in `list` be reordered; saves the new order for `project`. */
function makeSortable(list, project) {
  list.addEventListener('pointerdown', (e) => {
    const g = e.target.closest('.grip');
    const card = g && g.closest('[data-id]');
    if (!card || e.button > 0) return;
    e.preventDefault();
    startDrag(e, card, list, project);
  });
  list.addEventListener('keydown', (e) => {
    const g = e.target.closest('.grip');
    const card = g && g.closest('[data-id]');
    if (!card || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const sib = e.key === 'ArrowUp' ? prevTask(card) : nextTask(card);
    if (!sib) return;
    if (e.key === 'ArrowUp') list.insertBefore(card, sib); else list.insertBefore(card, sib.nextSibling);
    g.focus();
    saveOrder(project, listIds(list), card.dataset.id);
  });
}

function prevTask(card) { let s = card.previousElementSibling; while (s && !s.dataset.id) s = s.previousElementSibling; return s; }
function nextTask(card) { let s = card.nextElementSibling; while (s && !s.dataset.id) s = s.nextElementSibling; return s; }
function listIds(list) { return [...list.querySelectorAll('[data-id]')].map((x) => x.dataset.id); }

function startDrag(e, card, list, project) {
  dragging = true;
  const before = listIds(list).join();
  const rect = card.getBoundingClientRect();
  const offsetY = e.clientY - rect.top;
  // A floating copy follows the pointer; the original stays as a faded placeholder.
  // The copy lives in the same list (so it keeps the card's look) but is
  // position: fixed, so it floats above everything and takes no space.
  const ghost = card.cloneNode(true);
  ghost.removeAttribute('data-id');
  ghost.classList.add('drag-ghost');
  Object.assign(ghost.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px' });
  list.append(ghost);
  card.classList.add('drag-placeholder');

  const move = (ev) => {
    ghost.style.top = (ev.clientY - offsetY) + 'px';
    const others = [...list.querySelectorAll('[data-id]')].filter((x) => x !== card);
    const target = others.find((x) => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
    list.insertBefore(card, target || list.querySelector('.task-more') || null);
    // Scroll a scrolling list (the expanded view) when dragging near its edges.
    const lr = list.getBoundingClientRect();
    if (ev.clientY < lr.top + 30) list.scrollTop -= 12;
    else if (ev.clientY > lr.bottom - 30) list.scrollTop += 12;
  };
  const end = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', end);
    ghost.remove();
    card.classList.remove('drag-placeholder');
    dragging = false;
    const ids = listIds(list);
    if (ids.join() !== before) saveOrder(project, ids, card.dataset.id);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}

/** Shows the new order right away, then saves it. `moved` keeps focus/highlight on the moved task. */
async function saveOrder(project, ids, moved) {
  const p = lastTasks && lastTasks.projects.find((x) => x.number === project);
  const col = p && p.columns.find((c) => c.items.some((t) => t.id === ids[0]));
  if (col) {
    const rank = new Map(ids.map((id, i) => [id, i]));
    col.items.sort((a, b) => (rank.get(a.id) ?? Infinity) - (rank.get(b.id) ?? Infinity));
  }
  renderTasks(lastTasks, moved);
  try {
    const res = await api(null, { action: 'tasks.reorder', project, ids });
    if (res.ok) { if (!dragging && res.tasks) renderTasks(res.tasks, moved); }
    else if (res.error === 'unauthorized') showLock('The passcode has changed. Enter the new one.');
    else refresh();
  } catch (err) {
    refresh(); // couldn't save: go back to the server's order
  }
}

// ---- Full-screen task board ---------------------------------------------

function openTasks(number) {
  expanded = number;
  $('taskOverlay').hidden = false;
  renderExpanded();
  $('tvClose').focus();
}

function closeTasks() {
  expanded = null;
  $('taskOverlay').hidden = true;
}

function renderExpanded() {
  const projects = (lastTasks && lastTasks.projects) || [];
  const p = projects.find((x) => x.number === expanded);
  if (!p) { closeTasks(); return; }

  const tabs = $('tvTabs');
  tabs.replaceChildren();
  projects.forEach((x) => {
    const b = el('button', '', x.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(x.number === p.number));
    b.addEventListener('click', () => { expanded = x.number; renderExpanded(); });
    tabs.append(b);
  });
  const open = p.columns.reduce((n, c) => n + c.items.length, 0);
  $('tvInfo').replaceChildren(document.createTextNode(open + ' open · ' + p.doneCount + ' done · '));
  const link = el('a', '', 'Open in GitHub');
  link.href = p.url;
  link.target = '_blank';
  link.rel = 'noopener';
  $('tvInfo').append(link);

  const board = $('tvBoard');
  board.replaceChildren();
  p.columns.forEach((c) => {
    const colEl = el('section', 'tv-col ' + c.kind);
    const h = el('h3', '', c.label);
    h.append(el('b', '', String(c.items.length)));
    const ul = el('ul', 'tv-list');
    if (!c.items.length) ul.append(el('li', 'tv-empty', 'Nothing here'));
    c.items.forEach((t) => {
      const li = el('li', 'tv-card ' + c.kind);
      const a = el('a', 't-title', t.title);
      a.href = t.url;
      a.target = '_blank';
      a.rel = 'noopener';
      const body = el('div', 'tv-body');
      body.append(a, el('div', 't-meta', [t.ref, t.assignees.length ? t.assignees.join(', ') : 'unassigned'].join(' · ')));
      if (t.id) { li.dataset.id = t.id; li.append(grip()); }
      li.append(body);
      ul.append(li);
    });
    makeSortable(ul, p.number);
    colEl.append(h, ul);
    board.append(colEl);
  });
}

$('tvClose').addEventListener('click', closeTasks);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && expanded !== null) closeTasks(); });

/** "updated 3 min ago" for the footer. */
function tasksAge() {
  if (!lastTasks || !lastTasks.updatedAt) return '';
  const mins = Math.round((Date.now() - new Date(lastTasks.updatedAt)) / 60000);
  const age = mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : Math.round(mins / 60) + ' h ago';
  return 'GitHub tasks ' + age + (lastTasks.error ? ' (GitHub unreachable, showing last copy)' : '');
}

/**
 * Trims one task column to its height: removes items from the bottom (always
 * keeping the first) and ends the column with "+N more".
 */
function fitTaskGroup(g) {
  const overflows = () => g.scrollHeight > g.clientHeight + 1;
  const list = g.querySelector('.task-list');
  let hidden = 0;
  let more = null;
  while (overflows() && list.querySelectorAll('.task').length > 1) {
    if (more) more.remove();
    list.querySelector('.task:last-of-type').remove();
    hidden++;
    more = el('li', 'task-more', '+' + hidden + ' more');
    list.append(more);
  }
}

function renderAnnouncements(items) {
  const ul = $('announcements');
  ul.replaceChildren();
  if (!items.length) {
    ul.append(el('p', 'empty', 'No reminders. Add them on the admin page.'));
    return;
  }
  items.forEach((a) => ul.append(el('li', '', a.text)));
}

function renderDeadlines(items) {
  const ul = $('deadlines');
  ul.replaceChildren();
  if (!items.length) {
    ul.append(el('p', 'empty', 'Nothing due soon. Add dates on the admin page.'));
    return;
  }
  items.slice(0, MAX_DEADLINES).forEach((d) => {
    const date = fromDayKey(d.date);
    const li = el('li', 'deadline' + (d.daysLeft <= 7 ? ' soon' : ''));
    const dateBox = el('div', 'dl-date');
    dateBox.append(
      el('span', 'dow', date.toLocaleDateString([], { weekday: 'short' })),
      el('span', 'md', date.toLocaleDateString([], { month: 'short', day: 'numeric' })));
    const title = el('div', 'dl-title', d.title);
    if (d.category) title.append(el('span', 'dl-cat', d.category));
    li.append(dateBox, title, el('div', 'dl-left', daysLeftText(d.daysLeft)));
    ul.append(li);
  });
}

// Refit the names when the window changes size (for example, going full screen).
let lastHere = [];
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderTasks(lastTasks); renderHere(lastHere); }, 150);
});

function renderHere(here) {
  lastHere = here;
  $('hereCount').textContent = here.length ? String(here.length) : '';
  const ul = $('hereList');
  ul.replaceChildren();
  ul.classList.remove('two-col');
  if (!here.length) {
    ul.append(el('p', 'empty', 'No one is checked in yet.'));
    return;
  }
  [...here]
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach((s) => ul.append(el('li', '', s.name)));
  fitHereList(ul);
}

/**
 * Makes the names fit the pane: one column if possible, then two columns,
 * then smaller text. As a last resort the list ends with "+N more".
 * (In two-column mode extra names spill sideways, so check width too.)
 */
function fitHereList(ul) {
  // Overflowing = the last name sits below or to the right of the pane.
  const overflows = () => {
    const box = ul.getBoundingClientRect();
    const last = ul.lastElementChild.getBoundingClientRect();
    return last.bottom > box.bottom + 1 || last.right > box.right + 1;
  };
  ul.style.fontSize = '';
  if (!overflows()) return;
  ul.classList.add('two-col');
  for (let rem = 1.05; overflows() && rem >= 0.8; rem -= 0.05) ul.style.fontSize = rem.toFixed(2) + 'rem';
  let hidden = 0;
  let more = null;
  while (overflows() && ul.children.length > 1) {
    if (more) more.remove();
    ul.lastElementChild.remove();
    hidden++;
    more = el('li', 'more', '+' + hidden + ' more');
    ul.append(more);
  }
}

// ---- Helpers ------------------------------------------------------------

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/** "2026-11-14" -> local Date at midnight (not UTC, which can show the day before). */
function fromDayKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysLeftText(n) {
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 14) return 'in ' + n + ' days';
  return 'in ' + Math.round(n / 7) + ' weeks';
}

function fmtTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

function tick() {
  const now = new Date();
  $('clock').textContent = fmtTime(now);
  $('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  const stale = !lastUpdate || now - lastUpdate > STALE_MS;
  $('foot').classList.toggle('stale', stale && !!lastUpdate);
  $('updated').textContent = !lastUpdate ? 'Loading…'
    : stale ? "Can't reach the server. Last updated " + fmtTime(lastUpdate)
    : 'Updated ' + fmtTime(lastUpdate) + (tasksAge() ? ' · ' + tasksAge() : '');
}
tick();
setInterval(tick, 10 * 1000);

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

// ---- Start --------------------------------------------------------------

if (BigBoard.code) start(); else showLock('');
</script>
</body>
</html>
